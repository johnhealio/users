# Local dev reverse proxy: puts every function's browser-facing UI and
# API behind one shared origin, so browser storage (the DPoP keypair in
# IndexedDB, the session token in sessionStorage) is visible across
# functions the way it will be in production behind the Global Load
# Balancer (see the "prod-routing-path-based-single-domain" decision).
#
# Not used in production — this is purely to make local manual browser
# testing on this VM possible without a real deployment.
#
# Each backend must be started with RP_ORIGIN=http://localhost:8080 (this
# proxy's origin) for DPoP's htu binding to match what the browser signs.
# `authorization` (8084) is deliberately not routed here: it's
# server-to-server only, called directly by the other backends' own
# processes, never by a browser.

server {
    listen 8080;
    server_name localhost;

    location = / {
        return 302 /register/;
    }

    # Shared static UI chrome (nav, css, images) — served directly,
    # no backend involved.
    location /common/ {
        alias /home/john_johnheal_io/users/common/static/;
    }

    # Per-function pages + their own static assets. Trailing slashes on
    # both the location and proxy_pass strip the prefix, so each backend
    # keeps seeing exactly the paths it always has.
    location /register/ {
        proxy_pass http://127.0.0.1:8081/;
    }

    location /logon/ {
        proxy_pass http://127.0.0.1:8082/;
    }

    location /logout/ {
        proxy_pass http://127.0.0.1:8083/;
    }

    location /check1/ {
        proxy_pass http://127.0.0.1:8085/;
    }

    location /check2/ {
        proxy_pass http://127.0.0.1:8086/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8087/;
    }

    # Per-function API namespaces — already absolute, globally unique
    # paths, proxied as-is (no prefix stripping needed).
    location /api/register/ {
        proxy_pass http://127.0.0.1:8081/api/register/;
    }

    location /api/logon/ {
        proxy_pass http://127.0.0.1:8082/api/logon/;
    }

    location = /api/logout {
        proxy_pass http://127.0.0.1:8083/api/logout;
    }

    location = /api/check1 {
        proxy_pass http://127.0.0.1:8085/api/check1;
    }

    location = /api/check2 {
        proxy_pass http://127.0.0.1:8086/api/check2;
    }

    location /api/admin/ {
        proxy_pass http://127.0.0.1:8087/api/admin/;
    }
}
