<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — johnheal.io</title>
  <link rel="stylesheet" href="/common/styles.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="admin-main">
    <div class="card">
      <h1>Functions</h1>
      <form id="function-form">
        <label for="function-id">Function ID</label>
        <input id="function-id" required />
        <label for="function-name">Name</label>
        <input id="function-name" required />
        <label for="function-description">Description</label>
        <input id="function-description" required />
        <button type="submit">Register / update</button>
      </form>
      <button type="button" id="functions-refresh">Refresh list</button>
      <ul id="functions-list"></ul>
      <p id="functions-status" class="status"></p>
    </div>

    <div class="card">
      <h1>Users</h1>
      <p>Click a user to edit their group membership.</p>
      <button type="button" id="users-refresh">Refresh list</button>
      <ul id="users-list" class="picker-list"></ul>
      <div id="user-detail" hidden>
        <h2 id="user-detail-heading"></h2>
        <ul id="user-groups-checklist" class="checklist"></ul>
      </div>
      <p id="users-status" class="status"></p>
    </div>

    <div class="card">
      <h1>Groups</h1>
      <form id="group-form">
        <label for="group-id">Group ID</label>
        <input id="group-id" required />
        <label for="group-name">Name</label>
        <input id="group-name" required />
        <button type="submit">Create / update</button>
      </form>
      <button type="button" id="groups-refresh">Refresh list</button>
      <p>Click a group below to edit its permitted functions.</p>
      <ul id="groups-list" class="picker-list"></ul>
      <div id="group-detail" hidden>
        <h2 id="group-detail-heading"></h2>
        <ul id="group-functions-checklist" class="checklist"></ul>
      </div>
      <p id="groups-status" class="status"></p>
    </div>

    <div class="card">
      <h1>Grants</h1>
      <form id="grant-form">
        <label for="grant-function-id">Function ID</label>
        <input id="grant-function-id" required />
        <label for="grant-group-id">Group ID (leave blank if granting to a user)</label>
        <input id="grant-group-id" />
        <label for="grant-user-id">User ID (leave blank if granting to a group)</label>
        <input id="grant-user-id" />
        <label for="grant-attributes">Attributes (JSON object)</label>
        <input id="grant-attributes" value="{}" />
        <button type="submit" id="grant-set-btn">Set grant</button>
        <button type="button" id="grant-revoke-btn">Revoke grant</button>
      </form>
      <form id="grant-list-form">
        <label for="grant-list-function-id">Function ID</label>
        <input id="grant-list-function-id" required />
        <button type="submit">List grants</button>
      </form>
      <ul id="grants-list"></ul>
      <p id="grants-status" class="status"></p>
    </div>
  </main>

  <script src="/common/dpop.js"></script>
  <script src="index.js"></script>
</body>
</html>
